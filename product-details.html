<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Product Details | Intelitek</title>

  <!-- Use a modern Google Font -->

  <!-- Minimal page-scoped styles so you don't need to edit global CSS -->
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Product detail page styles — inline to prevent conflicts with styles.css -->
  <style>

/* CLICKABLE PRODUCT IMAGE */
.clickable-image{
  cursor: zoom-in !important;
  transition: 0.3s ease !important;
}

.clickable-image:hover{
  transform: scale(1.03) !important;
}

/* POPUP BACKGROUND */
.image-popup{
  display:none;
  position:fixed;
  z-index:9999;
  padding-top:40px;
  left:0;
  top:0;
  width:100%;
  height:100%;
  overflow:auto;
  background:rgba(0,0,0,0.92);
}

/* POPUP IMAGE */
.popup-content{
  display:block;
  margin:auto;
  max-width:90%;
  max-height:85vh;
  object-fit:contain;
  border-radius:8px;
  background:#fff;
  padding:10px;
}

/* CLOSE BUTTON */
.close-popup{
  position:absolute;
  top:15px;
  right:35px;
  color:#fff;
  font-size:40px;
  font-weight:bold;
  cursor:pointer;
}

.close-popup:hover{
  opacity:0.7;
}


    /* ── RESET ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #f5f6f8 !important; }
    body {
      font-family: "DM Sans", system-ui, sans-serif !important;
      color: #1a2332 !important;
      font-size: 14px !important;
      line-height: 1.6 !important;
    }

    /* ── CSS VARIABLES ───────────────────────────────────── */
    :root {
      --navy:       #0b2c5a;
      --blue:       #0f62a8;
      --light-blue: #e8f1fb;
      --border:     #d8dde6;
      --bg:         #f5f6f8;
      --white:      #ffffff;
      --text:       #1a2332;
      --muted:      #5a6478;
      --accent-bar: #e8edf4;
    }

    /* ── NAV HEADER ──────────────────────────────────────── */
    header {
      background: var(--navy) !important;
      padding: 0 24px !important;
      display: flex !important;
      align-items: center !important;
      height: 60px !important;
      box-shadow: none !important;
    }
    header nav { display: none !important; }
    .logo img { height: 40px !important; display: block !important; }

    /* ── BREADCRUMB ──────────────────────────────────────── */
    .breadcrumb {
      background: #fff !important;
      border-bottom: 1px solid var(--border) !important;
      padding: 10px 0 !important;
      font-size: 13px !important;
      color: var(--muted) !important;
    }
    .breadcrumb .container { display: flex !important; align-items: center !important; gap: 6px !important; }
    .breadcrumb a { color: var(--blue) !important; text-decoration: none !important; }
    .breadcrumb a:hover { text-decoration: underline !important; }
    .breadcrumb span { color: var(--text) !important; font-weight: 600 !important; }

    /* ── CONTAINER ───────────────────────────────────────── */
    .container { max-width: 1100px !important; margin: 0 auto !important; padding: 0 24px !important; }

    /* ── ITEM NO BAR ─────────────────────────────────────── */
    .item-no-bar {
      background: var(--accent-bar) !important;
      border-bottom: 1px solid var(--border) !important;
      padding: 10px 0 !important;
    }
    .item-no-bar .inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .item-no-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .item-no-value {
      font-size: 14px;
      font-weight: 700;
      color: var(--navy);
      background: var(--white);
      border: 1px solid var(--border);
      padding: 3px 12px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    /* ── PRODUCT CARD ────────────────────────────────────── */
    .product-wrapper { padding: 28px 0 0 0 !important; }
    .product-card {
      background: var(--white) !important;
      border: 1px solid var(--border) !important;
      border-radius: 4px !important;
      overflow: hidden !important;
      box-shadow: none !important;
    }

    /* Title bar */
    .product-title-bar {
      background: var(--navy) !important;
      padding: 18px 28px !important;
    }
    .product-title-bar h1 {
      margin: 0 !important;
      font-family: "Source Serif 4", Georgia, serif !important;
      font-size: 22px !important;
      font-weight: 700 !important;
      color: #ffffff !important;
      letter-spacing: 0.3px !important;
      line-height: 1.3 !important;
      text-transform: uppercase !important;
      text-align: left !important;
      padding: 0 !important;
    }

    /* Image + info two-column grid */
    .product-body-grid {
      display: grid !important;
      grid-template-columns: 320px 1fr !important;
      border-top: 1px solid var(--border) !important;
    }

    /* Left column */
    .product-img-col {
      border-right: 1px solid var(--border) !important;
      padding: 24px !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      gap: 16px !important;
      background: #fafbfc !important;
    }
    .product-img-col img {
      width: 100% !important;
      max-width: 260px !important;
      height: 240px !important;
      object-fit: contain !important;
      border: 1px solid var(--border) !important;
      border-radius: 4px !important;
      background: #fff !important;
      padding: 12px !important;
      box-shadow: none !important;
      transform: none !important;
    }
    .product-img-col img:hover { transform: none !important; }

    /* Action buttons */
    .product-actions {
      display: flex !important;
      flex-direction: column !important;
      gap: 8px !important;
      width: 100% !important;
      max-width: 240px !important;
    }
    .btn {
      display: block !important;
      text-align: center !important;
      padding: 10px 16px !important;
      border-radius: 4px !important;
      font-size: 13px !important;
      font-weight: 600 !important;
      text-decoration: none !important;
      border: none !important;
      cursor: pointer !important;
      letter-spacing: 0.3px !important;
      width: 100% !important;
      margin: 0 !important;
    }
    .btn-primary { background: var(--navy) !important; color: #fff !important; box-shadow: none !important; }
    .btn-primary:hover { background: #0a2348 !important; }
    .btn-whatsapp { background: #25D366 !important; color: #fff !important; }
    .btn-outline { background: transparent !important; border: 1px solid var(--navy) !important; color: var(--navy) !important; }
    .btn-outline:hover { background: var(--light-blue) !important; }

    /* Badge */
    .product-badge {
      font-size: 11px !important;
      font-weight: 700 !important;
      letter-spacing: 0.8px !important;
      text-transform: uppercase !important;
      color: var(--blue) !important;
      background: var(--light-blue) !important;
      border: 1px solid #c2d8f0 !important;
      padding: 4px 10px !important;
      border-radius: 3px !important;
    }

    /* Right column */
    .product-info-col { padding: 24px 28px !important; }

    .product-lead {
      font-size: 14px !important;
      color: var(--muted) !important;
      margin: 0 0 20px 0 !important;
      line-height: 1.7 !important;
      border-left: 3px solid var(--blue) !important;
      padding-left: 12px !important;
    }

    .info-section-title {
      font-size: 12px !important;
      font-weight: 700 !important;
      letter-spacing: 1px !important;
      text-transform: uppercase !important;
      color: var(--navy) !important;
      border-bottom: 2px solid var(--navy) !important;
      padding-bottom: 6px !important;
      margin: 20px 0 12px 0 !important;
    }

    /* Features */
    .features-list { list-style: none !important; padding: 0 !important; margin: 0 !important; }
    .features-list li {
      padding: 5px 0 5px 18px !important;
      position: relative !important;
      font-size: 13.5px !important;
      color: var(--text) !important;
      border-bottom: 1px solid #f0f2f5 !important;
      line-height: 1.5 !important;
    }
    .features-list li:last-child { border-bottom: none !important; }
    .features-list li::before {
      content: "▸" !important;
      position: absolute !important;
      left: 0 !important;
      color: var(--blue) !important;
      font-size: 11px !important;
      top: 6px !important;
    }

    /* Specs table */
    .specs-table { width: 100% !important; border-collapse: collapse !important; font-size: 13px !important; }
    .specs-table tr { border-bottom: 1px solid #f0f2f5 !important; }
    .specs-table tr:last-child { border-bottom: none !important; }
    .specs-table td:first-child {
      font-weight: 600 !important;
      color: var(--navy) !important;
      padding: 6px 12px 6px 0 !important;
      width: 140px !important;
      white-space: nowrap !important;
      vertical-align: top !important;
    }
    .specs-table td:last-child { color: var(--muted) !important; padding: 6px 0 !important; }

    /* Bulk CTA strip */
    .bulk-cta-strip {
      background: var(--accent-bar) !important;
      border-top: 1px solid var(--border) !important;
      padding: 14px 28px !important;
      display: flex !important;
      align-items: center !important;
      gap: 16px !important;
      flex-wrap: wrap !important;
    }
    .bulk-cta-strip p { margin: 0 !important; font-size: 13px !important; font-weight: 600 !important; color: var(--muted) !important; flex: 1 !important; }
    .bulk-cta-strip .btns { display: flex !important; gap: 10px !important; }
    .bulk-cta-strip .btn { width: auto !important; display: inline-block !important; }

    /* ── ARTICLES SECTIONS ───────────────────────────────── */
    .articles-wrapper {
      max-width: 1100px !important;
      margin: 0 auto !important;
      padding: 24px 24px 40px !important;
    }
    .articles-block {
      background: var(--white) !important;
      border: 1px solid var(--border) !important;
      border-radius: 4px !important;
      margin-bottom: 20px !important;
      overflow: hidden !important;
      box-shadow: none !important;
    }
    .articles-block-header {
      background: var(--accent-bar) !important;
      border-bottom: 2px solid var(--navy) !important;
      padding: 11px 16px !important;
      font-size: 12px !important;
      font-weight: 700 !important;
      letter-spacing: 1px !important;
      text-transform: uppercase !important;
      color: var(--navy) !important;
    }

    /* Article table */
    .article-table { width: 100% !important; border-collapse: collapse !important; table-layout: fixed !important; }
    .article-table thead tr { background: #fafbfc !important; border-bottom: 1px solid var(--border) !important; }
    .article-table thead th {
      padding: 9px 14px !important;
      font-size: 12px !important;
      font-weight: 700 !important;
      color: var(--muted) !important;
      text-align: left !important;
      letter-spacing: 0.5px !important;
      text-transform: uppercase !important;
    }
    .article-table thead th:last-child { text-align: right !important; }
    .article-table tbody tr { border-bottom: 1px solid #eef0f4 !important; }
    .article-table tbody tr:last-child { border-bottom: none !important; }

    /* Clickable rows */
    .art-row { cursor: pointer !important; }
    .art-row:hover { background: #edf4ff !important; }
    .art-row:hover .art-name { color: var(--blue) !important; }
    .art-row:hover .art-code { color: var(--navy) !important; }
    .art-row:active { background: #d6e8ff !important; }

    .art-row-hint {
      display: none !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      color: var(--blue) !important;
      margin-left: 8px !important;
    }
    .art-row:hover .art-row-hint { display: inline !important; }

    /* Table cells */
    .art-num { padding: 13px 8px 13px 16px !important; font-size: 13px !important; font-weight: 700 !important; color: var(--muted) !important; width: 40px !important; text-align: center !important; vertical-align: middle !important; }
    .art-img { padding: 8px !important; width: 68px !important; }
    .art-img img {
      width: 52px !important; height: 52px !important;
      object-fit: contain !important;
      border: 1px solid var(--border) !important;
      border-radius: 3px !important;
      background: #fafbfc !important;
      padding: 3px !important;
      box-shadow: none !important;
      transform: none !important;
    }
    .art-img img:hover { transform: none !important; }
    .art-name { 
      padding: 13px 12px !important; 
      font-size: 13.5px !important; 
      color: var(--text) !important; 
      line-height: 1.5 !important;
      word-break: normal !important;
      overflow-wrap: break-word !important;
      white-space: normal !important;
    }
    .art-code { 
      width: 100px !important;
      padding: 13px 16px 13px 8px !important; 
      font-size: 13px !important; 
      font-weight: 700 !important; 
      color: var(--blue) !important; 
      white-space: nowrap !important; 
      text-align: right !important; 
      font-family: "Courier New", monospace !important;
      vertical-align: middle !important;
    }

    /* ── RESPONSIVE ──────────────────────────────────────── */
    @media (max-width: 768px) {
      .product-body-grid { grid-template-columns: 1fr !important; }
      .product-img-col { border-right: none !important; border-bottom: 1px solid var(--border) !important; }
      .bulk-cta-strip { flex-direction: column !important; }
      .art-img { display: none !important; }

      /* Fix table on mobile — name wraps properly, code stays on one line */
      .article-table { table-layout: fixed !important; width: 100% !important; }
      .art-num  { width: 30px !important; padding: 10px 6px 10px 10px !important; }
      .art-name {
        width: auto !important;
        padding: 10px 8px !important;
        font-size: 13px !important;
        word-break: normal !important;
        overflow-wrap: break-word !important;
        white-space: normal !important;
        line-height: 1.5 !important;
      }
      .art-code {
        width: 90px !important;
        padding: 10px 10px 10px 4px !important;
        font-size: 12px !important;
        white-space: nowrap !important;
        text-align: right !important;
        vertical-align: middle !important;
      }
      /* Header alignment matches cells */
      .article-table thead th:nth-child(2) { text-align: left !important; }
      .article-table thead th:last-child { text-align: right !important; padding-right: 10px !important; }
    }

    /* Hide elements from main styles.css that we don't need */
    .page-hero { display: none !important; }
    footer { display: none !important; }
  </style>

</head>
<body>

  <!-- NAV HEADER -->
  <header>
    <div class="container" style="display:flex; align-items:center; gap:16px; height:60px;">
      <a href="index.html" class="logo"><img src="images/logo.png" alt="Intelitek logo"></a>
    </div>
  </header>

  <!-- BREADCRUMB -->
  <div class="breadcrumb">
    <div class="container">
      <a href="index.html">Home</a> /
      <a href="products.html">Products</a> /
      <span id="breadcrumbCurrent">Product</span>
    </div>
  </div>

  <!-- ITEM NO BAR -->
  <div class="item-no-bar">
    <div class="inner">
      <span class="item-no-label">Item No:</span>
      <span class="item-no-value" id="itemNoDisplay">—</span>
      <span class="product-badge" id="productBadge" style="margin-left:8px;">Training Kit</span>
    </div>
  </div>

  <!-- PRODUCT CARD -->
  <div class="product-wrapper">
    <div class="container">
      <div class="product-card">

        <!-- TITLE BAR -->
        <div class="product-title-bar">
          <h1 id="productTitle">Loading…</h1>
        </div>

        <!-- IMAGE + INFO -->
        <div class="product-body-grid">

          <!-- LEFT: image + buttons -->
          <div class="product-img-col">

              <a id="enquiryBtn" class="btn btn-primary" href="#">Enquire Now</a>

          </div>

          <!-- RIGHT: info -->
          <div class="product-info-col">

        <div class="bulk-cta-strip">

            <a class="btn btn-primary" id="emailUsBtn" href="contact.html">Email Us</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ARTICLES / REQUIRED / RECOMMENDED / ACCESSORIES -->
  <div id="articlesSection"></div>


  <!-- Product mapping & page script -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const params = new URLSearchParams(window.location.search);

      // ── If opened from an article row (artname= in URL), show that item ──
      const artName  = params.get("artname");
      const artCode  = params.get("artcode");
      const artImg   = params.get("artimg");
      const artParent = params.get("artparent"); // parent product key

      if (artName) {
        const displayImg    = artImg  || "images/sensor.png";
        const displayCode   = artCode || "—";
        const sectionLabel  = params.get("artsection") || "articles";

        // Section-specific badge & description
        const sectionInfo = {
          articles:     { badge: "Training Module",    desc: "Course module included with the training kit. Provides hands-on practical learning for engineering laboratory practice." },
          linked:       { badge: "Training Product",   desc: "Engineering training product compatible with Intelitek training systems. Designed for engineering colleges, polytechnics and ITI institutes." },
          accessories:  { badge: "Accessory",          desc: "Accessory item for Intelitek training systems. Includes spare parts, cables, tools and consumables to support laboratory operations." },
        };
        const info = sectionInfo[sectionLabel] || sectionInfo.articles;

        document.title = artName + " | Intelitek";
        document.getElementById("productTitle").innerText       = artName;
        document.getElementById("breadcrumbCurrent").innerText  = artName;
        document.getElementById("productImage").src             = displayImg;
        document.getElementById("productImage").alt             = artName;
        document.getElementById("productLead").innerText        = info.desc;
        document.getElementById("productBadge").innerText       = info.badge;
        document.getElementById("itemNoDisplay").innerText      = displayCode;
        document.getElementById("productExtra").innerText       =
          "Ideal for engineering colleges, ITIs and skill development centres across India.";

        // Features
        const fwrap = document.getElementById("productFeatures");
        fwrap.innerHTML = "";
        const featuresBySection = {
          articles: [
            "Hands-on practical training module",
            "Compatible with Intelitek training platform",
            "Includes experiment guide and instructions",
            "Industry-standard components and connectors",
            "Safe and durable for laboratory use",
            "Curriculum-aligned learning outcomes"
          ],
          linked: [
            "Industry-grade training equipment",
            "Compatible with Intelitek systems",
            "Designed for engineering education",
            "Includes installation and user manual",
            "After-sales technical support available",
            "Suitable for engineering colleges and ITIs"
          ],
          accessories: [
            "Genuine Intelitek accessory",
            "Designed for use with Intelitek training systems",
            "High quality, lab-grade materials",
            "Easy to install and replace",
            "Ensures continued lab operation",
            "Available in bulk for institutional orders"
          ]
        };
        (featuresBySection[sectionLabel] || featuresBySection.articles).forEach(f => {
          const li = document.createElement("li");
          li.textContent = f;
          fwrap.appendChild(li);
        });

        // Specs
        const specsBody = document.querySelector("#specsBlock tbody");
        document.getElementById("specsHeading").style.display = "";
        specsBody.innerHTML = `
          <tr><td>Item Code</td><td>${displayCode}</td></tr>
          <tr><td>Type</td><td>${info.badge}</td></tr>
          <tr><td>Compatible With</td><td>Intelitek Training Systems</td></tr>
          <tr><td>Application</td><td>Engineering College / Polytechnic / ITI Lab</td></tr>
        `;

        // Buttons
        const enquiryText = encodeURIComponent(artName + " (" + displayCode + ")");
        document.getElementById("enquiryBtn").href  = "contact.html?product=" + enquiryText;
        document.getElementById("emailUsBtn").href  = "contact.html?product=" + enquiryText;
        document.getElementById("whatsappBtn").href =
          "https://wa.me/919187562018?text=Hello%20Intelitek%2C%20I%20am%20interested%20in%20" +
          encodeURIComponent(artName);
        document.getElementById("brochureBtn").href = "#";

        // Breadcrumb back link
        if (artParent) {
          const bc = document.getElementById("breadcrumbCurrent");
          bc.innerHTML = `<a href="product-details.html?name=${encodeURIComponent(artParent)}" style="color:var(--blue);text-decoration:none;">← Back to Product</a>&nbsp;/&nbsp;${artName}`;
        }

        // No sub-articles for these pages
        document.getElementById("articlesSection").innerHTML = "";
        return;
      }

      // ── Normal product page ───────────────────────────────────────────────
      const key = (params.get("name") || "sensor").toLowerCase();

      // product data - use simple filenames (no special characters)
      const products = {
        sensor: {
          title: "Sensor Training Kit",
          short: "Sensor Training Kit",
          image: "images/sensor.png",
          lead: "Comprehensive industrial sensor training system for automation laboratories.",
          features: [
            "Industrial grade sensors",
            "Real-time signal monitoring",
            "PLC compatible",
            "Compact modular design",
            "Safety protected circuits",
            "Detailed experiment manual included"
          ],
          specs: {
            "Power": "230 V AC / 50 Hz (typical)",
            "Trainer Area": "Proximity, Photoelectric, Ultrasonic, Temperature sensors",
            "Includes": "Power supply, mounting frame, wiring kit, manual"
          },
          badge: "Sensors"
        },

        micro: {
          title: "Micro Controller Training Kit – IES 2044",
          short: "Micro Controller Kit",
          image: "images/Micro-Controller Training Kit – IES 2044.png",
          lead: "Embedded systems learning platform — microcontroller programming, interfacing and real-time projects.",
          features: [
            "Hands-on microcontroller programming",
            "LCD, keypad & sensor interfacing",
            "UART / SPI / I2C communication experiments",
            "PWM and motor control labs",
            "Sample projects & exercises"
          ],
          specs: {
            "Controller": "Popular 8/16-bit microcontroller (configurable)",
            "I/O": "Multiple digital and analog I/O terminals",
            "Includes": "Breadboard, modules, power supply, sample codes"
          },
          badge: "Embedded"
        },

        electronics: {
          title: "Electronics Lab Trainer",
          short: "Electronics Lab Trainer",
          image: "images/Electronics Lab Trainer Kit Manufacturers & Suppliers.jpg",
          lead: "Complete lab for analog & digital electronics experiments — amplifiers, op-amps, logic families and more.",
          features: [
            "Amplifier & filter experiments",
            "Op-amp and comparator labs",
            "Digital logic and flip-flop experiments",
            "Built-in function generator & power rails",
            "Safe and modular workstation"

        if (!items || items.length === 0) return "";
        const rows = items.map((item, i) => {
          let url;
          if (item.link) {
            // Known product — open its full product page
            url = `product-details.html?name=${encodeURIComponent(item.link)}`;
          } else {
            // Article module, accessory, or any other item
            // — open as a detail page using its own data
            url = `product-details.html?artname=${encodeURIComponent(item.name)}&artcode=${encodeURIComponent(item.code)}&artimg=${encodeURIComponent(item.img)}&artparent=${encodeURIComponent(key)}&artsection=${encodeURIComponent(sectionType)}`;
